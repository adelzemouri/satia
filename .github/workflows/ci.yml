name: CI

# Minutes Actions comptées (dépôt privé, 2 000 min/mois) : la suite complète tourne sur les
# pull requests ; sur main, déjà testée dans la PR, seul le contrôle rapide repasse.
on:
  pull_request:
    paths-ignore: ["docs/**", "**/*.md"]
  # Relancée par le workflow « Données Ciqual » : un push fait avec GITHUB_TOKEN ne déclenche pas la CI.
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgres://pommelia:pommelia@localhost:5432/pommelia
  S3_ENDPOINT: http://localhost:9000
  S3_REGION: auto
  S3_BUCKET: pommelia-photos
  S3_ACCESS_KEY_ID: pommelia
  S3_SECRET_ACCESS_KEY: pommelia-secret
  S3_FORCE_PATH_STYLE: "true"
  BETTER_AUTH_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
  SETUP_TOKEN: ci-setup-token-1234
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  quality:
    name: Lint, format, typecheck, tests unitaires
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  integration:
    name: Tests d'intégration, build et e2e
    # Après le contrôle rapide : une erreur de lint ou de type ne coûte pas un passage e2e.
    needs: quality
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: pommelia, POSTGRES_PASSWORD: pommelia, POSTGRES_DB: pommelia }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U pommelia" --health-interval 3s --health-retries 20
      storage:
        image: rustfs/rustfs:latest
        env: { RUSTFS_ACCESS_KEY: pommelia, RUSTFS_SECRET_KEY: pommelia-secret }
        ports: ["9000:9000"]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm foods:import
      - run: node scripts/ensure-bucket.mjs
      - run: pnpm test:integration
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: playwright-report, retention-days: 7 }
