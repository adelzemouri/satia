name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgres://satia:satia@localhost:5432/satia
  S3_ENDPOINT: http://localhost:9000
  S3_REGION: auto
  S3_BUCKET: satia-photos
  S3_ACCESS_KEY_ID: satia
  S3_SECRET_ACCESS_KEY: satia-secret
  S3_FORCE_PATH_STYLE: "true"
  BETTER_AUTH_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
  SETUP_TOKEN: ci-setup-token-1234
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  quality:
    name: Lint, format, typecheck, tests unitaires
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  integration:
    name: Tests d'intégration, build et e2e
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: satia, POSTGRES_PASSWORD: satia, POSTGRES_DB: satia }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U satia" --health-interval 3s --health-retries 20
      storage:
        image: rustfs/rustfs:latest
        env: { RUSTFS_ACCESS_KEY: satia, RUSTFS_SECRET_KEY: satia-secret }
        ports: ["9000:9000"]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm foods:import
      - run: node scripts/ensure-bucket.mjs
      - run: pnpm test:integration
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: playwright-report, retention-days: 7 }

  docker:
    name: Image Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with: { context: ., push: false, cache-from: type=gha, cache-to: "type=gha,mode=max" }
