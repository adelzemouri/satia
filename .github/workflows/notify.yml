name: Notifications

# Le cron de Vercel Hobby ne passe qu'une fois par jour : les rappels sont déclenchés d'ici.
# GitHub peut retarder un passage de quelques minutes ; chaque rappel garde une fenêtre de
# plusieurs heures et n'est envoyé qu'une fois.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: notify
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      APP_URL: ${{ secrets.APP_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Déclencher les rappels
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::warning::Secrets APP_URL ou CRON_SECRET absents : rappels ignorés."
            exit 0
          fi
          curl --fail-with-body --silent --show-error --max-time 60 \
            -H "Authorization: Bearer $CRON_SECRET" "${APP_URL%/}/api/cron/notify"
