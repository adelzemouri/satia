name: Sauvegarde de la base

# Neon Free ne permet de restaurer que les 6 dernières heures : on garde 30 jours de dumps chiffrés dans R2.
on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
      AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      S3_ENDPOINT: ${{ secrets.BACKUP_S3_ENDPOINT }}
      S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
      PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
      RETENTION_DAYS: 30
    steps:
      - name: Vérifier la configuration
        id: config
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$S3_BUCKET" ] || [ -z "$PASSPHRASE" ]; then
            echo "::warning::Secrets BACKUP_* absents : sauvegarde ignorée."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Installer le client PostgreSQL 17
        if: steps.config.outputs.skip != 'true'
        run: |
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17
      - name: Dump chiffré vers le stockage objet
        if: steps.config.outputs.skip != 'true'
        run: |
          file="pommelia-$(date -u +%Y-%m-%dT%H%M%SZ).dump.gpg"
          /usr/lib/postgresql/17/bin/pg_dump --format=custom --no-owner "$DATABASE_URL" \
            | gpg --batch --symmetric --cipher-algo AES256 --passphrase "$PASSPHRASE" -o "$file"
          aws s3 cp "$file" "s3://$S3_BUCKET/backups/$file" --endpoint-url "$S3_ENDPOINT"
      - name: Purger les sauvegardes de plus de 30 jours
        if: steps.config.outputs.skip != 'true'
        run: |
          limit=$(date -u -d "-$RETENTION_DAYS days" +%Y-%m-%d)
          aws s3 ls "s3://$S3_BUCKET/backups/" --endpoint-url "$S3_ENDPOINT" | awk '{print $4}' | while read -r name; do
            day="${name:6:10}"
            if [[ -n "$day" && "$day" < "$limit" ]]; then
              aws s3 rm "s3://$S3_BUCKET/backups/$name" --endpoint-url "$S3_ENDPOINT"
            fi
          done
