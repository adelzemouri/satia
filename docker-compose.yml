# Environnement local complet : `docker compose up` puis http://localhost:3000
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: satia
      POSTGRES_PASSWORD: satia
      POSTGRES_DB: satia
    ports: ["5432:5432"]
    volumes: [db-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U satia"]
      interval: 3s
      retries: 20

  storage:
    # Serveur S3 compatible pour le local (R2 en production).
    image: rustfs/rustfs:latest
    environment:
      RUSTFS_ACCESS_KEY: satia
      RUSTFS_SECRET_KEY: satia-secret
    ports: ["9000:9000"]
    volumes: [storage-data:/data]

  setup:
    # Migrations + création du bucket local, puis s'arrête.
    build: { context: ., target: build }
    depends_on:
      db: { condition: service_healthy }
      storage: { condition: service_started }
    environment: &app-env
      DATABASE_URL: postgres://satia:satia@db:5432/satia
      BETTER_AUTH_SECRET: local-secret-local-secret-local-secret
      SETUP_TOKEN: local-setup-token-1234
      S3_ENDPOINT: http://storage:9000
      S3_REGION: auto
      S3_BUCKET: satia-photos
      S3_ACCESS_KEY_ID: satia
      S3_SECRET_ACCESS_KEY: satia-secret
      S3_FORCE_PATH_STYLE: "true"
    command: sh -c "pnpm db:migrate && node scripts/ensure-bucket.mjs"

  app:
    build: .
    depends_on:
      db: { condition: service_healthy }
      setup: { condition: service_completed_successfully }
    environment: *app-env
    ports: ["3000:3000"]

volumes:
  db-data:
  storage-data:
